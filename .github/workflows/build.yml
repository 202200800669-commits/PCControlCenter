name: Build and simulation tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build PCControlCenter.sln -c Release
      - run: dotnet run --project tests/PCControlCenter.Tests -c Release --no-build
