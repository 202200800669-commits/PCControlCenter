name: 新型号适配
description: 提交型号与只读检测结果
title: "[适配] 品牌 型号"
body:
  - type: input
    id: application
    attributes:
      label: 程序版本与构建提交
      description: 程序版本见诊断包；构建提交见 BUILD.json 的 sourceCommit。
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 品牌和完整型号
      description: 不要填写序列号
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: BIOS 和 Windows 版本
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 只读检测结果 / GitHub 模板输出
      description: 可直接在桌面端设置页点击“复制 GitHub 反馈模板”，或在终端运行“pc-control feedback-template”并将输出粘贴在此处；也可上传 diagnostics.json 脱敏包。
      placeholder: 请在此粘贴 pc-control feedback-template 生成的 Markdown 文本或 diagnostics.json 脱敏内容
  - type: textarea
    id: requested
    attributes:
      label: 希望支持的功能及官方控制工具名称
  - type: dropdown
    id: privilege
    attributes:
      label: 本次读取权限
      options:
        - 普通权限
        - 通过 UAC 的同账户管理员权限
        - UAC 已取消或未完成
        - 不确定
    validations:
      required: true
